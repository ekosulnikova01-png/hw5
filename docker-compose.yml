version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: pg15_hw5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata_hw5:/var/lib/postgresql/data

volumes:
  pgdata_hw5: